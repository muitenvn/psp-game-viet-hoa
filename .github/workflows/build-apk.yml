name: Build APK & Publish Release

on:
  push:
    branches:
      - main
      - master
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 3. Configure Android SDK & Accept Licenses
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_HOME}"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> $GITHUB_ENV

          mkdir -p "${ANDROID_HOME}/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n8933bad161af4178b1185d1a37fbf41ea5269c55\n" > "${ANDROID_HOME}/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "${ANDROID_HOME}/licenses/android-sdk-preview-license"

          SDKMANAGER_BIN=$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f | head -n 1)
          if [ -n "${SDKMANAGER_BIN}" ]; then
            yes | "${SDKMANAGER_BIN}" --licenses > /dev/null 2>&1 || true
            "${SDKMANAGER_BIN}" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          fi

      - name: 4. Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: 5. Prepare .env and Deterministic Debug Keystore
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              cat << 'EOF' | base64 -d > debug.keystore
          
          EOF
            fi
          fi

      - name: 6. Build Debug APK with Gradle
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: 7. Prepare APK File for Release
        id: package_apk
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION_TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION_TAG="v1.0.${{ github.run_number }}"
          fi
          APK_NAME="PSP-Localization-Studio-${VERSION_TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "${APK_NAME}"
          sha256sum "${APK_NAME}" > "${APK_NAME}.sha256"
          echo "version_tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT
          echo "sha_name=${APK_NAME}.sha256" >> $GITHUB_OUTPUT

      - name: 8. Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package_apk.outputs.apk_name }}
          path: |
            ${{ steps.package_apk.outputs.apk_name }}
            ${{ steps.package_apk.outputs.sha_name }}

      - name: 9. Publish APK to GitHub Releases
        if: "!startsWith(github.ref, 'refs/pull/')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package_apk.outputs.version_tag }}
          name: "PSP Localization Studio ${{ steps.package_apk.outputs.version_tag }}"
          body: |
            ## 🎮 PSP Localization Studio (${{ steps.package_apk.outputs.version_tag }})
            Bản build APK tự động từ commit `${{ github.sha }}`.

            ### ⚠️ Lưu ý khi cài đặt đè lên bản v1.0.2 cũ:
            - Nếu trước đó bạn đã cài bản `v1.0.2` (bản bị ẩn icon và dùng khóa ký ngẫu nhiên), hãy vào **Cài đặt (Settings) -> Ứng dụng (Apps) -> PSP Localization Studio -> Gỡ cài đặt (Uninstall)** trước khi cài bản mới này.
          draft: false
          prerelease: false
          files: |
            ${{ steps.package_apk.outputs.apk_name }}
            ${{ steps.package_apk.outputs.sha_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
