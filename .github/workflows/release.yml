name: Android APK Build & GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag phiên bản cho GitHub Release (ví dụ: v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_notes:
        description: 'Ghi chú phát hành (Release Notes)'
        required: false
        default: 'Bản phát hành tự động ứng dụng Việt hóa ROM PSP (.iso) sử dụng Kiến trúc AI 2 Tầng.'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Upload to GitHub Releases
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Gradle with Caching
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 4. Prepare Environment & Keystore
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -alias androiddebugkey \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass android -keypass android \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: 5. Build Signed Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: 6. Resolve Tag Name & Rename APK Artifact
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          APK_OUT="PSP-Localization-Studio-${TAG_NAME}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "${APK_OUT}"
          sha256sum "${APK_OUT}" > "${APK_OUT}.sha256"
          echo "apk_path=${APK_OUT}" >> $GITHUB_OUTPUT
          echo "sha_path=${APK_OUT}.sha256" >> $GITHUB_OUTPUT

      - name: 7. Upload APK Artifact to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.apk_path }}
          path: |
            ${{ steps.meta.outputs.apk_path }}
            ${{ steps.meta.outputs.sha_path }}

      - name: 8. Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: "PSP Localization Studio ${{ steps.meta.outputs.tag_name }} (Two-Tier AI ROM Translator)"
          body: |
            ## 🎮 PSP Localization Studio ${{ steps.meta.outputs.tag_name }}
            Ứng dụng Android tự động Việt hóa ROM PSP (`.iso`) sử dụng **Kiến trúc AI 2 Tầng (Two-Tier AI Architecture)**.

            ### ✨ Tính năng cốt lõi trong bản build:
            - **Tầng 1 (Scout & Context Analyzer - `gemini-2.5-flash` / `gemini-3.8-flash`)**: Tự động dò tìm file ngôn ngữ trong `PSP_GAME/USRDIR`, phân tích mã điều khiển và sinh `translation_rules.json` (Regex bảo vệ thẻ hệ thống + Glossary xưng hô).
            - **Tầng 2 (Bulk Translator - `gemini-2.5-flash-lite` / `gemini-3.5-flash-lite` + Fallback)**: Dịch gom lô 100-150 câu/request, tự động ẩn mã hệ thống thành `{0}`, `{1}` trước khi dịch và khôi phục nguyên vẹn sau khi dịch.
            - **SQLite / Room Checkpointing**: Lưu tức thì từng câu đã dịch vào Room Database; hết quota ngày có thể bấm **Tiếp tục dịch (Resume)** vào hôm sau mà không mất dữ liệu.
            - **RandomAccessFile + SAF**: Đọc/ghi trực tiếp trên file `.iso` dung lượng lớn không gây tràn RAM.

            ${{ github.event.inputs.release_notes }}
          draft: false
          prerelease: false
          files: |
            ${{ steps.meta.outputs.apk_path }}
            ${{ steps.meta.outputs.sha_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
